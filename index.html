<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life in Mongol Empire</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef2f4;--ink:#16252e;--mut:#5b6b75;--card:#fff;--line:#c9d3d9;--acc:#1d5f8a;--ok:#2f8f3a;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a21;--ink:#e6eef2;--mut:#93a5b0;--card:#18252e;--line:#2b3d49;--acc:#6cb4e4;--ok:#6fcf7a;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#101a21;--ink:#e6eef2;--mut:#93a5b0;--card:#18252e;--line:#2b3d49;--acc:#6cb4e4;--ok:#6fcf7a;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);padding:6px 12px;font-size:14px;margin:4px 0 0;flex:none}
@media (prefers-color-scheme:dark){button.ghost{color:var(--ink)}}
.sub{color:var(--mut);margin:0 0 12px;font-size:14px}
.lives{display:flex;gap:6px;align-items:center;margin-bottom:12px;font-size:15px}
.heart{width:22px;height:22px;border-radius:50%;background:var(--bad)}
.heart.off{background:transparent;border:2px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
h2{font-size:20px;margin:0 0 8px}
.wrap{position:relative;width:100%;max-width:300px;margin:8px auto}
.stage{display:flex;gap:14px;align-items:center;justify-content:center}
.wcol{flex:1;min-width:0}
.lcol{flex:0 0 190px;text-align:left}
.lcol ol{margin:0;padding-left:18px;font-size:12px;max-height:150px;overflow-y:auto}
.chbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px}
.chbox svg{width:100%;height:auto;display:block}
@media (max-width:480px){.lcol{flex-basis:130px}}
canvas{width:100%;height:auto;display:block;transition:transform 4s cubic-bezier(.12,.7,.1,1)}
.ptr{position:absolute;left:50%;top:-8px;width:0;height:0;margin-left:-11px;border:11px solid transparent;border-top:20px solid var(--ink);border-bottom:0}
button{font:inherit;font-weight:bold;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 20px;cursor:pointer;margin:6px 4px}
:root[data-theme="dark"] button,button{color:#fff}
@media (prefers-color-scheme:dark){button{color:#0b1a24}}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.res{min-height:48px;font-size:18px;margin:6px 0}
.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:13px;color:var(--mut);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
ol{padding-left:20px;color:var(--mut);font-size:14px}
</style></head><body><main>
<header class="top"><h1>Life in Mongol Empire</h1><button id="reset" class="ghost" type="button">Reset all</button></header>
<p class="sub">Spin each wheel. Dying costs a life. If you have an extra life, you redo the spin instead of ending.</p>
<div class="lives" id="lives" aria-live="polite"></div>
<div class="card">
<h2 id="title"></h2>
<div class="stage"><div class="lcol"><div class="chbox" id="chbox"></div><p class="sub" style="margin:6px 0 0;font-size:13px">Path this run</p><ol id="log"></ol></div><div class="wcol"><div class="wrap"><div class="ptr"></div><canvas id="c" width="600" height="600"></canvas></div>
<div class="leg" id="leg"></div></div></div>
<div class="res" id="res" aria-live="polite"></div>
<button id="spin">Spin</button><button id="next" hidden>Next wheel</button>
</div>
</main>
<script>
const K="#2b2b2b",R="#8b1a1a",Y="#e2b400",B="#1f8fd1",P="#e58aa8",G="#5a9f2e",O="#e07a1f",Gy="#7d7d7d",Br="#a8682f",Gn="#1c9a4a",Pu="#8a3fa8",Be="#c9b88a",Bl="#5d7fb0",Nv="#2e3a6e";
const W={
birth:{t:"Birth",s:[{l:"Born",p:55,c:K,to:"gender"},{l:"Died (restart)",p:30,c:R,to:"X"},{l:"Disabled",p:15,c:Y,to:"disabled",fx:{col:"#e8c200"}}]},

slave:{t:"Noble's slave",s:[{l:"Fall in love",p:5,c:P,to:"noble",fx:{o:"ggown"}},{l:"Died of old age (restart)",p:35,c:Gy,to:"X"},{l:"Killed (restart)",p:60,c:R,to:"X"}]},

};
const cv=document.getElementById("c"),cx=cv.getContext("2d"),$=id=>document.getElementById(id);
let cur="birth",lives=1,rot=0,busy=false,pending=null,path=[];
function draw(){
 const w=W[cur],S=600,r=290;cx.clearRect(0,0,S,S);let a=-Math.PI/2;
 w.s.forEach(s=>{const d=s.p/100*2*Math.PI;cx.beginPath();cx.moveTo(S/2,S/2);cx.arc(S/2,S/2,r,a,a+d);cx.closePath();cx.fillStyle=s.c;cx.fill();cx.lineWidth=3;cx.strokeStyle="#fff";cx.stroke();
 if(s.p>=8){cx.save();cx.translate(S/2,S/2);cx.rotate(a+d/2);cx.fillStyle="#fff";cx.font="bold 30px Georgia";cx.textAlign="right";cx.shadowColor="#000";cx.shadowBlur=4;
 const t=s.p+"% "+s.l;let f=30;cx.font="bold "+f+"px Georgia";while(cx.measureText(t).width>r-50&&f>12){f--;cx.font="bold "+f+"px Georgia"}cx.fillText(t,r-18,f/3);cx.restore()}
 a+=d});
 $("title").textContent=w.t;
 $("leg").innerHTML=w.s.map(s=>`<span><i style="background:${s.c}"></i>${s.p}% ${s.l}</span>`).join("");
}
function hearts(){$("lives").innerHTML="Lives "+Array.from({length:Math.max(1,lives)},(_,i)=>`<span class="heart ${i<lives?"":"off"}"></span>`).join("")+` <span>${lives}</span>`}
function log(t){path.push(t);$("log").innerHTML=path.map(x=>`<li>${x}</li>`).join("")}
function show(){sw=null;renderChar();cv.style.transition="none";rot=0;cv.style.transform="rotate(0)";draw();$("res").textContent="";$("res").className="res";$("spin").hidden=false;$("spin").disabled=false;$("next").hidden=true;$("spin").textContent="Spin"}
$("spin").onclick=()=>{
 if($("spin").dataset.mode==="reset"){lives=1;ch=newCh();$("spin").dataset.mode="";path=[];$("log").innerHTML="";cur="birth";hearts();show();return}
 if(busy)return;busy=true;$("spin").disabled=true;
 const w=W[cur];let x=Math.random()*100,acc=0,idx=0;
 for(let i=0;i<w.s.length;i++){acc+=w.s[i].p;if(x<acc){idx=i;break}}
 let start=w.s.slice(0,idx).reduce((q,s)=>q+s.p,0);
 const pos=(start+w.s[idx].p*(0.15+0.7*Math.random()))/100*360;
 rot=360*6+(360-pos);
 cv.style.transition="transform 4s cubic-bezier(.12,.7,.1,1)";cv.style.transform=`rotate(${rot}deg)`;
 setTimeout(()=>{busy=false;land(w.s[idx])},4100)};
let prev=null,redo=false,sw=null;
function land(s){
 const res=$("res");log(`${W[cur].t}: ${s.l}`);pending=s.to;prev={...ch};sw=W[s.to]?s.to:null;applyFx(s);
 if(s.to==="X"){lives--;hearts();res.textContent=`${s.l}. You lose a life, but an extra life lets you redo your last spin.`;res.className="res bad";
  if(lives<=0){res.textContent="Out of lives. Game over.";$("spin").hidden=false;$("spin").disabled=false;$("spin").textContent=s.l;$("spin").dataset.mode="reset";return}
  $("next").textContent="Redo last spin";$("next").hidden=false;$("spin").hidden=true;pending=cur;redo=true;path.push("--- extra life used: redo ---");}
 else if(s.to==="V"){if(s.life){lives++;hearts()}res.textContent=`${s.l}. You survived!`+(s.life?" +1 extra life.":"");res.className="res ok";
  $("next").textContent="Spin again from birth";$("next").hidden=false;$("spin").hidden=true;pending="birth";path.push("--- run complete ---");}
 else{res.textContent=`${s.l}. Go to the next wheel.`;$("next").textContent="Next wheel: "+W[s.to].t;$("next").hidden=false;$("spin").hidden=true}
}
$("next").onclick=()=>{cur=pending;if(redo){ch=prev;redo=false}if(cur==="birth")ch=newCh();if(cur==="birth")$("log").innerHTML=path.slice(-0).length?$("log").innerHTML:"";show()};
function fullReset(){if(busy)return;redo=false;lives=1;ch=newCh();path=[];$("log").innerHTML="";cur="birth";pending=null;$("spin").dataset.mode="";hearts();show()}
$("reset").onclick=fullReset;
